# Every formula change passes `brew style`, `brew audit --strict --online`, and
# an install plus `brew test` on Linux and macOS before the merge queue lands
# it. `ci-ok` is the required check. Everything runs on Sylphx runners. Pull
# requests from forks do not run here, so outside code never runs on them; the
# formula bump PRs come from this repository.
name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CHECKS: |
    brew style sylphxai/tap/sylphx
    brew audit --strict --online --formula sylphxai/tap/sylphx
    brew install --formula sylphxai/tap/sylphx
    brew test sylphxai/tap/sylphx

jobs:
  # Linux: Homebrew's own image (digest-pinned), run with Docker on our runner.
  linux:
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 10
      - name: brew style, audit, install, test
        run: |
          docker run --rm -v "$PWD:/src:ro" -e CHECKS \
            -e HOMEBREW_NO_AUTO_UPDATE=1 -e HOMEBREW_NO_INSTALL_CLEANUP=1 -e HOMEBREW_NO_ANALYTICS=1 \
            ghcr.io/homebrew/ubuntu22.04@sha256:d0ca41bfd05a7d08f4a3f8ee89e93794b16931a982ab25c4193beb27c6f588bd \
            bash -euo pipefail -c '
              tap="$(brew --repository)/Library/Taps/sylphxai/homebrew-tap"
              mkdir -p "$tap" && cp -R /src/. "$tap/"
              eval "$CHECKS"'

  # macOS: our macOS runners (a persistent machine with Homebrew installed).
  # The checkout is tapped directly, without updating Homebrew, and removed
  # again afterwards.
  macos:
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, sylphx, macos, standard]
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v6
        timeout-minutes: 10
      - name: brew style, audit, install, test
        run: |
          set -euo pipefail
          tap="$(brew --repository)/Library/Taps/sylphxai/homebrew-tap"
          rm -rf "$tap" && mkdir -p "$tap" && cp -R . "$tap/"
          trap 'brew uninstall --formula sylphxai/tap/sylphx >/dev/null 2>&1 || true; rm -rf "$tap"' EXIT
          eval "$CHECKS"

  ci-ok:
    if: always()
    needs: [linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.linux.result }}" = success ] && [ "${{ needs.macos.result }}" = success ]'
